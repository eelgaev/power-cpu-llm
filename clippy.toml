# The C library's transcendentals round differently in different builds of
# libm (a static binary carries its own); use the bit-exact ports in src/libm.
disallowed-methods = [
    { path = "f32::exp", reason = "use crate::libm::expf" },
    { path = "f64::exp", reason = "use crate::libm::exp" },
    { path = "f64::ln", reason = "use crate::libm::ln" },
    { path = "f32::sin", reason = "use crate::libm::sincosf" },
    { path = "f32::cos", reason = "use crate::libm::sincosf" },
    { path = "f32::sin_cos", reason = "use crate::libm::sincosf" },
    { path = "f32::powf", reason = "use crate::libm::powf" },
    { path = "f64::powf", reason = "use crate::libm::pow" },
    { path = "f64::tanh", reason = "use crate::libm::tanh" },
    { path = "f64::exp_m1", reason = "use crate::libm::expm1" },
]
